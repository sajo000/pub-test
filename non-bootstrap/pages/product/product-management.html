    // 페이지네이션
    $(document).ready(function () {
      const totalPages = 123; // 전체 페이지 수
      const pageGroupSize = 5; // 한 번에 보여질 페이지 버튼 개수

      const $container = $("#pagination-container");

      function renderPagination(currentPage) {
        $container.empty();

        const isFirstPage = currentPage === 1;
        const isLastPage = currentPage === totalPages;

        const groupStart = Math.floor((currentPage - 1) / pageGroupSize) * pageGroupSize + 1;
        let groupEnd = groupStart + pageGroupSize - 1;
        if (groupEnd > totalPages) {
          groupEnd = totalPages;
        }

        // 처음, 이전 버튼
        $container.append(createButton("<<", function () {
          renderPagination(1);
        }, !isFirstPage, false, true, currentPage, totalPages));
        $container.append(createButton("<", function () {
          renderPagination(currentPage - 1);
        }, !isFirstPage, false, true, currentPage, totalPages));

        // 페이지 번호 버튼들
        for (let i = groupStart; i <= groupEnd; i++) {
          $container.append(createButton(i, function () {
            renderPagination(i);
          }, true, currentPage === i));
        }

        // 다음, 마지막 버튼
        $container.append(createButton(">", function () {
          renderPagination(currentPage + 1);
        }, !isLastPage, false, true, currentPage, totalPages));
        $container.append(createButton(">>", function () {
          renderPagination(totalPages);
        }, !isLastPage, false, true, currentPage, totalPages));
      }

      // 버튼 생성 함수
      function createButton(text, onClick, enabled = true, isActive = false, isArrow = false, currentPage = 1, totalPages = 1) {
        const $btn = $("<button>").prop("disabled", !enabled);

        if (isArrow) {
          const $icon = $("<i>");

          let baseClass = "icon is-20 ";

          if (text === "<<") {
            baseClass += "icon-arrow-double-left bg-gray-6b";
          } else if (text === "<") {
            baseClass += "icon-arrow-left bg-gray-6b";
          } else if (text === ">") {
            baseClass += "icon-arrow-right bg-gray-6b";
          } else if (text === ">>") {
            baseClass += "icon-arrow-double-right bg-gray-6b";
          }

          if ((text === "<<" || text === "<") && currentPage === 1) {
            baseClass = baseClass.replace("bg-gray-6b", "bg-gray-cc");
          }

          if ((text === ">" || text === ">>") && currentPage === totalPages) {
            baseClass = baseClass.replace("bg-gray-6b", "bg-gray-cc");
          }

          $icon.addClass(baseClass);
          $btn.append($icon);
        } else {
          $btn.text(text);
        }

        if (isActive) {
          $btn.addClass("active");
        }
        if (isArrow) {
          $btn.addClass("arrow-button");
        } else {
          $btn.addClass("page-button");
        }

        $btn.on("click", function () {
          if (enabled) {
            onClick();
          }
        });

        return $btn;
      }

      // 초기 렌더링 호출
